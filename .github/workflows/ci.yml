name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter @actiondev/desktop exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @actiondev/desktop lint

      - name: Install Playwright browsers
        run: pnpm --filter @actiondev/desktop exec playwright install chromium --with-deps

      - name: Smoke tests
        run: pnpm --filter @actiondev/desktop test:e2e:smoke

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/e2e/report/
          retention-days: 7
